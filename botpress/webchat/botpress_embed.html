<!-- Botpress Webchat Embed (Botpress Cloud) -->
<div id="webchat-container" style="position: relative; width: 100%; height: 600px;">
  <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
  <script>
    // 1) Paste your Botpress config snippet (window.botpress.init(...)) from your Botpress dashboard here.
    // 2) Optional: auto-open embedded webchat on load.
    window.botpress.on('webchat:initialized', () => {
      window.botpress.open()
    })
  </script>
  <style>
    #webchat-container { position: relative; width: 100%; height: 600px; }
    .bpFab { display: none; }
    .bpWebchat {
      position: absolute !important;
      top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
      width: 100% !important; height: 100% !important; max-height: 100% !important;
    }
  </style>
</div>
